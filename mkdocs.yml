site_name: DynamoDB Simplified
site_description: A fluent DynamoDB wrapper for Java with typed builders for common DynamoDB operations
repo_url: https://github.com/hogwai/dynamodb-simplified
site_url: https://hogwai.github.io/dynamodb-simplified/

theme:
  name: material
  palette:
    - scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy

nav:
  - Home: index.md
  - Quickstart: quickstart.md
  - Guides:
      - Expressions: guides/expressions.md
      - Async API: guides/async.md
      - Batch and Results: guides/batch-and-results.md
      - Errors and Retries: guides/errors-and-retries.md
      - API Matrix: guides/api-matrix.md
      - Single-Table Design: guides/single-table-design.md
  - API Reference: javadoc/index.html

markdown_extensions:
  - admonition
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true

exclude_docs: |
  superpowers/**
